[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mbpy"
version = "0.1.0"
description = "A minimal Python greeter CLI"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
mbpy = "mbpy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mbpy*"]
